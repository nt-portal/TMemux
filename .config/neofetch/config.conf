print_info() {

    prin "┌───────── Hardware $(color 1)$(color 7) Information ─────────┐"

    prin

    info " " distro
    info " " model
    info " " kernel
    info " " uptime
    info " " packages
    prin "$(bash $HOME/.scripts/system/fetch.sh storage -n)"
    prin " " "https://github.com/nt-portal/TMemux"
    info " " shell
    info " " cpu
    info " " memory
    prin "$(bash $HOME/.scripts/system/fetch.sh battery)"
    prin " " "$(color 0)   $(color 1)  $(color 2)  $(color 3)  $(color 4)  $(color 5)  $(color 6)  $(color 7) "

    prin

    prin "└─────────────────── $(color 1)$(color 7) ────────────────────┘"

}

title_fqdn="off"

kernel_shorthand="on"

distro_shorthand="off"

os_arch="on"

uptime_shorthand="on"

memory_percent="off"

memory_unit="mib"

package_managers="on"

shell_path="off"

shell_version="on"

speed_type="bios_limit"

speed_shorthand="off"

cpu_brand="on"

cpu_speed="on"

cpu_cores="logical"

cpu_temp="off"

gpu_brand="on"

gpu_type="all"

refresh_rate="off"

gtk_shorthand="off"

gtk2="on"

gtk3="on"

public_ip_host="http://ident.me"

public_ip_timeout=2

de_version="on"

disk_show=('/')

disk_subtitle="mount"

disk_percent="on"

music_player="mpd"

song_format="%artist% - %title%"

song_shorthand="off"

mpc_args=()

colors=(distro)

bold="on"

underline_enabled="on"

underline_char="━"

seperator=":"

block_range=(0 7)

color_blocks="on"

block_width=3

block_height=1

col_offset="auto"

bar_char_elapsed="-"
bar_char_total="="

bar_border="on"

bar_length=15

bar_color_elapsed="distro"
bar_color_total="distro"

cpu_display="off"
memory_display="off"
battery_display="off"
disk_display="off"

image_backend="ascii"

